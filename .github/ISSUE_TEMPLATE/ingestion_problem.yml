name: Connection or ingestion problem
description: The adapter cannot reach or authenticate to the participant, publishes nothing, misses parties, or stops.
title: "[Ingestion]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the adapter does not get data flowing from your participant to the topic and you are not sure yet whether it is a bug or a setup problem.

        **This issue is public. Never paste a token.** Remove the Ledger API token (`CANTON_LEDGER_TOKEN`), any JWT or JWT secret, Kafka credentials, participant credentials, internal hostnames, and the party ids and participant ids of real clients. Replace them with placeholders such as `client::<id>` or `http://<participant>:7575`.

        Worth checking first, from the README: an expired JWT is a permanent `401` (there is no token refresh); the parties come from the rights of the Ledger API user (`CanReadAs`), not from the token; and a participant only sees updates in which one of its parties is a stakeholder or informee.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues and did not find this problem.
          required: true
        - label: I removed tokens, credentials and real client identifiers from everything below.
          required: true
  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      options:
        - Cannot reach the JSON Ledger API (connection refused, timeout, TLS)
        - Rejected by the participant (401 or 403)
        - Starts but no records arrive on the topic
        - Records are missing for some parties or some update kinds
        - No topology records, or topology only for some parties
        - Stops after Ledger API retries run out
        - Stops on the dead-letter circuit breaker
        - Updates land in the dead-letter topic
        - Bootstraps again after a restart instead of resuming
        - Cannot publish to Kafka
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you saw, and what you expected to see on the topic.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Canton node the adapter reads
      options:
        - demo/localnet from this repository (Docker, no auth)
        - Splice LocalNet
        - DevNet participant
        - TestNet participant
        - MainNet participant
        - Other
    validations:
      required: true
  - type: input
    id: canton-version
    attributes:
      label: Canton or Splice version
      description: The version of the participant node.
      placeholder: "Canton 3.5.16"
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Participant authentication
      description: How the JSON Ledger API of the node is protected. Do not paste the token or the secret.
      options:
        - No authentication (CANTON_LEDGER_TOKEN empty)
        - JWT signed with a shared secret (HS256)
        - JWT issued by an identity provider
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: rights
    attributes:
      label: Rights of the Ledger API user
      description: The rights of the user named in `CANTON_USER`.
      options:
        - CanReadAs for specific parties
        - CanReadAsAnyParty
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: reachability
    attributes:
      label: Does the Ledger API answer from the machine where the adapter runs?
      description: For example `curl <CANTON_JSON_API>/v2/parties/participant-id` with the same token.
      options:
        - "Yes"
        - "No"
        - Not tested
  - type: input
    id: version
    attributes:
      label: trunk-canton version
      description: Output of `pip show trunk-canton`, the image tag, or the commit you built from.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How you run it
      options:
        - Python package (`python -m trunk_canton` or the `trunk-canton` command)
        - Docker Compose stack from deploy/docker-compose.yml
        - Docker image built from deploy/Dockerfile
        - Helm chart from deploy/helm/trunk-canton
        - Other
    validations:
      required: true
  - type: input
    id: kafka
    attributes:
      label: Kafka broker
      description: The broker product and version, and whether it needs authentication. No credentials.
      placeholder: "Redpanda 24.2, no auth"
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The `CANTON_*` variables you set (or the Helm values) and the command line flags. Leave `CANTON_LEDGER_TOKEN` out and replace hosts with placeholders. Say where `CANTON_OFFSET_FILE` lives if the problem is about restarts.
      render: shell
      placeholder: |
        CANTON_JSON_API=http://<participant>:7575
        CANTON_USER=extractor
        CANTON_KAFKA_BOOTSTRAP=<broker>:9092
        CANTON_TX_TOPIC=canton.devnet.tx
        CANTON_OFFSET_FILE=/data/offset.txt
  - type: textarea
    id: logs
    attributes:
      label: Adapter logs
      description: From the start of the run up to the problem, not truncated. Check them for tokens and real identifiers first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: dlq
    attributes:
      label: Dead-letter record
      description: If updates are dead-lettered, one redacted record from the dead-letter topic (it carries the error and the raw body). Remove contract payloads and replace real ids.
      render: json
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: What you already tried, and whether the same setup works against `demo/localnet`.
