// Two participants, two synchronizers, one JVM. Modelled on examples/05-composability of the Canton release.
// p1 hosts the "client" party (the one the Extractor monitors); p2 hosts the counterparties.
canton {
  features.enable-testing-commands = yes
  monitoring.logging.api.message-payloads = false

  sequencers {
    seq1 { public-api { address = "0.0.0.0", port = 5001 }, admin-api { address = "0.0.0.0", port = 5002 }
           sequencer { type = reference, config.storage.type = memory }, storage.type = memory }
    seq2 { public-api { address = "0.0.0.0", port = 5101 }, admin-api { address = "0.0.0.0", port = 5102 }
           sequencer { type = reference, config.storage.type = memory }, storage.type = memory }
  }
  mediators {
    med1 { admin-api { address = "0.0.0.0", port = 5202 }, storage.type = memory }
    med2 { admin-api { address = "0.0.0.0", port = 5302 }, storage.type = memory }
  }
  participants {
    p1 { ledger-api { address = "0.0.0.0", port = 5011 }, admin-api { address = "0.0.0.0", port = 5012 }
         http-ledger-api { address = "0.0.0.0", port = 7575 }, storage.type = memory }
    p2 { ledger-api { address = "0.0.0.0", port = 5021 }, admin-api { address = "0.0.0.0", port = 5022 }
         http-ledger-api { address = "0.0.0.0", port = 7576 }, storage.type = memory }
  }
}
