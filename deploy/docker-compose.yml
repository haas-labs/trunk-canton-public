# Reference deployment: a local Redpanda broker + the Canton ingestion adapter.
# Point CANTON_JSON_API at a reachable participant (e.g. the demo Canton node in ../demo/localnet,
# started alone with `docker compose -f demo/localnet/docker-compose.yml up -d canton`).
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# The broker is published on localhost:29092 (not 19092), so it can run next to the demo/localnet
# broker:  kcat -b localhost:29092 -t canton.localnet.tx -C
#
# The offset lives on the named volume `offset`, so `docker compose restart adapter` resumes from
# the persisted offset instead of re-bootstrapping. `restart: unless-stopped` is the restart policy
# the adapter relies on when it exits on a sustained outage or a tripped dead-letter circuit breaker.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:29092
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12

  adapter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CANTON_JSON_API: ${CANTON_JSON_API:-http://host.docker.internal:7575}
      CANTON_USER: ${CANTON_USER:-extractor}
      CANTON_LEDGER_TOKEN: ${CANTON_LEDGER_TOKEN:-}
      CANTON_KAFKA_BOOTSTRAP: redpanda:9092
      CANTON_TX_TOPIC: ${CANTON_TX_TOPIC:-canton.localnet.tx}
      CANTON_TOPOLOGY_ALL_PARTIES: ${CANTON_TOPOLOGY_ALL_PARTIES:-1}
      CANTON_OFFSET_FILE: /data/offset.txt
    volumes:
      - offset:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  offset:
